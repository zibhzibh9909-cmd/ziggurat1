<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>الزقورة | Ziggurat</title>
<style>

html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Tahoma,"Segoe UI",Arial,sans-serif;overflow:hidden}

h1{margin:0;font-size:clamp(40px,9vw,76px);color:var(--gold);text-shadow:0 4px 0 #5a3d0a}
.sub{opacity:.8;margin:0 0 6px}
input{font:inherit;font-size:18px;padding:12px;border-radius:10px;border:2px solid var(--gold);background:#0b1410;color:var(--fg);text-align:center;width:min(300px,90vw)}
.teams{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tb{min-width:150px;padding:14px 18px;border-radius:14px;border:3px solid transparent;background:var(--panel);color:var(--fg);font:inherit;font-size:17px;cursor:pointer}
.tb.sel{border-color:var(--gold)}.tb:disabled{opacity:.4}
#tA{box-shadow:inset 0 -6px 0 var(--red)}#tB{box-shadow:inset 0 -6px 0 var(--blue)}
.go{padding:14px 40px;font:inherit;font-size:20px;font-weight:700;border:0;border-radius:12px;background:var(--gold);color:#201400;cursor:pointer}
#st{font-size:14px;opacity:.85;max-width:520px}
#dead{display:none;background:rgba(40,0,0,.75)}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
.pn{position:absolute;background:var(--panel);padding:6px 10px;border-radius:10px;font-size:14px}
#tl{top:calc(8px + env(safe-area-inset-top,0px));right:8px}
#tr{top:calc(8px + env(safe-area-inset-top,0px));left:8px;max-width:45vw}
#bl{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;min-width:150px}
#ch{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff9;border-radius:50%}
.bar{height:9px;background:#0008;border-radius:5px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#4cc460;width:100%}
#xp i{background:var(--gold);width:0}
#feed div{font-size:12px;margin-top:2px}
#hit{position:fixed;inset:0;box-shadow:inset 0 0 120px #d00;opacity:0;transition:opacity .3s;z-index:4;pointer-events:none}
#mob{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
.mb{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff3;border:2px solid #fff7;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto}

#mob{opacity:var(--bo,.8)}.mb{transform:scale(var(--bs,1))}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff6}
</style>
</head>
